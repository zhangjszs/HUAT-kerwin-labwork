name: 🐛 Bug 报告
description: 报告代码错误或意外行为
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰简洁地描述你遇到的问题
      placeholder: "例如：编译 data-structures/ 目录下的代码时出现链接错误"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 进入 '...' 目录
        2. 运行 '...'
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
      placeholder: "代码应该正常编译并输出正确结果"

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 提供你的开发环境信息
      placeholder: |
        - 操作系统：Windows 11 / macOS / Ubuntu
        - 编译器/版本：GCC 13 / JDK 17 / Python 3.12
        - IDE：VS Code / CLion / IDEA

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他有助于解决问题的信息（截图、日志等）
