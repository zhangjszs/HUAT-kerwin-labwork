name: 💡 功能请求
description: 建议新增课程、功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: 功能描述
      description: 请描述你希望添加的功能或改进
      placeholder: "例如：希望新增机器学习课程的实验代码"
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 动机与价值
      description: 为什么这个功能有价值？它会解决什么问题？
      placeholder: "这将帮助学弟学妹更好地理解机器学习基础概念"

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 其他相关信息或参考资料
